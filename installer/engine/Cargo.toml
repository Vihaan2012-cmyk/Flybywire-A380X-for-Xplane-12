[package]
name = "a380x-xp-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installs and updates the unofficial FlyByWire A380X for X-Plane 12; driven by the installer app."

[[bin]]
name = "a380x-xp-engine"
path = "src/main.rs"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
crc32fast = "1"
texpresso = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
