[package]
name = "xphfbw"
version = "0.1.0"
edition = "2021"
description = "XPHFBW: systems and instruments host for A380 for X-Plane 12"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "XPHFBW"
path = "src/main.rs"

[dependencies]
# Chromium Embedded Framework. The runtime (CEF 152) is exported once to
# D:\A380\fbw-build\cef; builds find it through CEF_PATH.
cef = { version = "=152.3.0", default-features = false }
# FlyByWire's systems and the plugin's shared-memory bridge (src/remote).
fbw_a380_systems_xp = { path = ".." }
serde_json = "1"
# tray.rs (notification-area icon and its menu) and crash.rs (unhandled
# exception filter): pure Win32, no CEF.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# views.rs: each screen's frame shared with the plugin as a D3D11 texture.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# build.rs: generates and embeds the app's .ico as a Windows resource.
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
