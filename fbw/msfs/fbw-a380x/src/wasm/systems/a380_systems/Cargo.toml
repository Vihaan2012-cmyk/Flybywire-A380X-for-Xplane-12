[package]
name = "a380_systems"
version = "0.1.0"
authors = ["FlyByWire Simulations"]
edition = "2021"

[dependencies]
bitflags = "2.9.1"
uom.workspace = true
nalgebra.workspace = true
rustc-hash = "2.1.1"
rand.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.16" }
toml = { version = "0.9.11+spec-1.1.0", default-features = false, features = ["std", "serde", "parse", "display"] }
systems = { path = "../../../../../fbw-common/src/wasm/systems/systems" }
enum-map = "2.7"
deep_systems = { path = "../deep_systems" }

[dev-dependencies]
ntest.workspace = true
rstest.workspace = true
rand_pcg = "0.9.0"
serde_json = "1.0"
mimalloc = { version = "0.1", default-features = false }
wasmtime = { version = "44", default-features = false, features = ["runtime", "cranelift", "std", "parallel-compilation"] }
